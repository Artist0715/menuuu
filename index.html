<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <STYLE>.space-3d{
        width:100vw;
        height:100vh;
        position:relative;
      }
      .card1{
        width:300px;
        height:420px;
        position:absolute;
        top:0;
        bottom:0;
        left:0;
        right:0;
        margin-left:auto;
          
      }
      .card1-front{
        width:300px;
        height:420px;
        position:absolute;
        top:0;
        bottom:0;
        left:0;
        right:0;
        margin-left:auto;
          
      }
      .card1-back{
        width:300px;
        height:420px;
        position:absolute;
        top:0;
        bottom:0;
        left:0;
        right:0;
        margin-left:auto;
          
      }
      .card1-front{background-image:url(https://cdn2.bulbagarden.net/upload/1/17/Cardback.jpg);
      background-size:300px 420px;
      background-repeat:no-repeat;
      background-position:center;}
      
      .card1-back{background-image:url(https://assets.codepen.io/13471/charizard-gx.webp);
      background-size:300px 420px;
      background-repeat:no-repeat;
      background-position:center;}
      
      .card1-front{
        transform:rotateY(0deg);
      }
      .card1-back{
        transform:rotateY(180deg);
      }
      .card1-front{
        backface-visibility:hidden;
      }
      .card1-back{
        backface-visibility:hidden;
      }
      .card1:hover .card1-front{
        transform:rotateY(180deg);
        backface-visibility:hidden;
      }
      .card1:hover .card1-back{
        transform:rotateY(360deg);
        backface-visibility:hidden;
      }
      
      .card1-front,.card1-back{
        transition:.5s;
      }
      .card1{
        perspective:500px;
      }
